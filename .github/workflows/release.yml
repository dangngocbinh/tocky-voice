# Builds installers for macOS, Windows and Linux and attaches them to a draft release.
#
# Tags only. The write-capable token lives here and nowhere else: CI runs on every branch
# and pull request, which is where untrusted code arrives, so it is a separate workflow
# with a read-only token. Pushing a tag is an act only someone with write access can
# perform, which is what makes it safe to hand this job a token that can publish.
#
# Third-party actions are pinned to commit SHAs, not tags — a tag can be moved by whoever
# controls the action, and this job holds a token that can publish binaries people install.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The draft has to exist before the matrix starts. Four parallel jobs each asking
  # tauri-action to create a release for the same tag is a race, and it loses: two of
  # them win, and the artifacts end up split across two drafts with neither complete.
  create-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.make.outputs.release_id }}
      # Handed to every build job below so tauri-action writes it into latest.json's
      # "notes" field too — without this it defaults to empty, and the in-app "what's
      # new" panel and the update-check toast render as blank even though the release
      # page itself reads fine.
      release_notes: ${{ steps.make.outputs.release_notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The release body is the CHANGELOG.md section for this version, so the same text
      # a maintainer reviewed in the PR reaches both the GitHub release page and the
      # in-app "what's new" panel (surfaced via latest.json's "notes" field). A tag with
      # no matching section fails here rather than shipping a release with no notes.
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: make
        env:
          # The release notes tell people how to open the app, and that instruction is
          # the opposite depending on how this build was signed. Derived from the
          # secrets rather than written by hand, so the two can never drift apart.
          #
          # Notarisation, not signing, is what decides the wording: a signed but
          # un-notarised app still needs right-click -> Open on a machine that
          # downloaded it, so claiming otherwise would strand people at the first
          # screen. Both are required before the notes promise a normal open.
          MACOS_SIGNED: ${{ secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        with:
          script: |
            const fs = require('fs')
            const tag = context.ref.replace('refs/tags/', '')
            const version = tag.replace(/^v/, '')

            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8')
            const match = changelog.match(
              new RegExp(`## \\[${version.replace(/\./g, '\\.')}\\][^\\n]*\\n([\\s\\S]*?)(?=\\n## \\[|$)`),
            )
            if (!match) {
              throw new Error(`CHANGELOG.md has no "## [${version}]" section — add one before tagging.`)
            }
            const notes = match[1].trim()

            // Vietnamese first, same as the changelog entry above it — this footer is
            // read by the same people, at the moment they are trying to open the app.
            const signedFooter = [
              '**macOS**: app đã được ký số và notarize bởi Apple — mở bình thường như mọi',
              'app khác. Vẫn phải cấp quyền Accessibility một lần thì thao tác dán mới chạy.',
              'Từ bản này trở đi app tự cập nhật được: bấm "Cập nhật ngay" trong app là xong,',
              'không phải tải lại thủ công.',
              '',
              '_English_: signed and notarised — opens normally. Accessibility permission is',
              'still needed once before pasting works, and updates install themselves from',
              'inside the app.',
            ].join('\n')

            const unsignedFooter = [
              '**macOS**: app chưa được notarize, nên lần mở đầu tiên phải bấm chuột phải →',
              'Open, và phải cấp quyền Accessibility thì thao tác dán mới chạy.',
              '',
              'Nếu macOS báo app "is damaged and can\'t be opened", chạy lệnh này trong',
              'Terminal rồi mở lại bình thường:',
              '`xattr -cr "/Applications/Tocky Voice.app"`',
              '',
              '_English_: the app is not notarised — first launch needs right-click → Open,',
              'and Accessibility permission must be granted before pasting works. If macOS',
              'says the app is damaged, run the `xattr -cr` command above.',
            ].join('\n')

            const footer =
              process.env.MACOS_SIGNED === 'true' ? signedFooter : unsignedFooter
            const body = `${notes}\n\n---\n\n${footer}`

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Tocky Voice ${tag}`,
              body,
              // Draft, so a human looks at what is about to be handed to people
              // before it becomes downloadable. Do NOT add a job that publishes this
              // automatically — releases/latest/download/latest.json only resolves for a
              // published release, so the draft is the gate that keeps an update from
              // reaching anyone before a human reviews the built assets.
              draft: true,
            })
            core.setOutput('release_id', data.id)
            core.setOutput('release_notes', body)

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      # One platform failing should not hide whether the others are fine.
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            name: macOS (Apple Silicon)
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            name: macOS (Intel)
          - platform: ubuntu-22.04
            args: ""
            name: Linux
          - platform: windows-latest
            args: ""
            name: Windows

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}

    # Job level so the signature check below can branch on it: a step cannot read the
    # `env` it declares itself, and `secrets` is not a context available to `if`.
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      # Notarisation is configured separately from signing, and a repo can legitimately
      # have one without the other — the check below has to branch on it rather than
      # demand a stapled ticket from a build that was only ever signed.
      APPLE_NOTARIZATION_CONFIGURED: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Catches "tagged v0.2.0 but forgot to bump tauri.conf.json" before any build
      # work runs — that mistake would otherwise produce a perfectly valid release that
      # no client ever accepts an update from.
      - name: Verify tag matches project version
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          conf_version=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*: *"([^"]+)".*/\1/')
          cargo_version=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          pkg_version=$(grep -m1 '"version"' package.json | sed -E 's/.*: *"([^"]+)".*/\1/')
          if [ "$tag" != "$conf_version" ] || [ "$tag" != "$cargo_version" ] || [ "$tag" != "$pkg_version" ]; then
            echo "::error::Version mismatch — tag=v$tag tauri.conf.json=$conf_version Cargo.toml=$cargo_version package.json=$pkg_version"
            exit 1
          fi

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf \
            build-essential \
            curl wget file libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts (Ed25519/minisign) so the updater plugin can
          # verify a downloaded update actually came from this pipeline. Unrelated to
          # Apple/Microsoft code signing — see src-tauri/tauri.conf.json's pubkey.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple Developer ID signing and notarisation. Unset on a fork or before the
          # secrets are configured, and tauri-action then simply builds unsigned — which
          # the app itself detects at runtime and falls back to manual downloads for
          # (see src-tauri/src/code_signature.rs). Nothing here needs a flag day.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # Upload into the draft the first job made, rather than each matrix job
          # trying to create one of its own.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # tauri-action only writes this into latest.json's "notes" field when it's
          # given explicitly — an existing releaseId does not make it read the release's
          # own body back out. Without this, every update-check in the app renders a
          # blank "what's new".
          releaseBody: ${{ needs.create-release.outputs.release_notes }}
          args: ${{ matrix.args }}
          # Windows ships both NSIS and MSI installers; the updater only ever installs
          # from one, and NSIS supports the silent self-replace this app relies on.
          updaterJsonPreferNsis: true

      # A mistyped or expired certificate secret does not fail the build — tauri-action
      # falls back to an unsigned bundle and the release looks fine. That is the failure
      # worth catching here: an unsigned build sent to people who were told updates are
      # automatic would leave them stranded on this version, because macOS refuses to
      # keep the Accessibility grant across an unsigned self-replace.
      - name: Verify the macOS bundle is signed and notarised
        if: matrix.platform == 'macos-latest' && env.APPLE_SIGNING_IDENTITY != ''
        shell: bash
        run: |
          set -euo pipefail
          # `-print -quit` rather than `| head -n 1`: under `pipefail` a `find` that
          # keeps printing after head exits dies on SIGPIPE and fails this step after a
          # complete four-platform build, for no reason anyone could read from the log.
          app=$(find . -type d -name "Tocky Voice.app" -path "*/bundle/macos/*" -print -quit)
          if [ -z "$app" ]; then
            echo "::error::built .app not found — cannot verify the signature"
            exit 1
          fi
          echo "checking $app"
          codesign --verify --deep --strict --verbose=2 "$app"
          if ! codesign -dv --verbose=2 "$app" 2>&1 | grep -q "^Authority=Developer ID Application"; then
            echo "::error::$app is not signed with a Developer ID Application certificate"
            exit 1
          fi
          # The stapled ticket is what lets the app open on a machine that has never
          # been online; without it Gatekeeper still phones home and can refuse.
          if [ "$APPLE_NOTARIZATION_CONFIGURED" = "true" ]; then
            xcrun stapler validate "$app"
          else
            echo "::warning::signed but not notarised — add APPLE_ID and APPLE_PASSWORD to notarise. Users will still see a Gatekeeper warning on first open."
          fi

  # tauri-action is expected to merge each matrix job's platform entry into one
  # latest.json on the draft release. That merge is not something this workflow can
  # observe directly, so treat it as unproven and check the result: a manifest missing
  # even one platform key would silently tell that platform's users they are already
  # up to date, forever.
  verify-manifest:
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    permissions:
      # GitHub's API rejects a GITHUB_TOKEN with only `contents: read` when reading a
      # DRAFT release (403 "Resource not accessible by integration") — draft visibility
      # requires the write tier even for a GET. This job still performs zero mutating
      # calls; the permission is a read-with-write-token, not license to write.
      contents: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const releaseId = ${{ needs.create-release.outputs.release_id }}
            const { data: release } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            })

            const asset = release.assets.find((a) => a.name === 'latest.json')
            if (!asset) {
              throw new Error('latest.json is missing from the draft release')
            }

            const response = await github.request(`GET ${asset.url}`, {
              headers: { accept: 'application/octet-stream' },
            })
            // octokit hands back a Buffer/ArrayBuffer for octet-stream, not a string —
            // normalise every shape it might take before parsing.
            const raw = Buffer.isBuffer(response.data)
              ? response.data.toString('utf8')
              : response.data instanceof ArrayBuffer
                ? Buffer.from(response.data).toString('utf8')
                : typeof response.data === 'string'
                  ? response.data
                  : JSON.stringify(response.data)
            const manifest = JSON.parse(raw)

            const tag = context.ref.replace('refs/tags/', '')
            const expectedVersion = tag.replace(/^v/, '')
            if (manifest.version !== expectedVersion) {
              throw new Error(`latest.json version "${manifest.version}" does not match tag "${expectedVersion}"`)
            }

            const requiredPlatforms = [
              'darwin-aarch64',
              'darwin-x86_64',
              'windows-x86_64',
              'linux-x86_64',
            ]
            const missing = requiredPlatforms.filter((platform) => {
              const entry = manifest.platforms && manifest.platforms[platform]
              return !entry || !entry.signature || !entry.url
            })
            if (missing.length > 0) {
              throw new Error(`latest.json is missing or incomplete for: ${missing.join(', ')}`)
            }

            console.log(`latest.json OK — version ${manifest.version}, platforms: ${Object.keys(manifest.platforms).join(', ')}`)
