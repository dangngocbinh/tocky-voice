# Builds installers for macOS, Windows and Linux and attaches them to a draft release.
#
# Tags only. The write-capable token lives here and nowhere else: CI runs on every branch
# and pull request, which is where untrusted code arrives, so it is a separate workflow
# with a read-only token. Pushing a tag is an act only someone with write access can
# perform, which is what makes it safe to hand this job a token that can publish.
#
# Third-party actions are pinned to commit SHAs, not tags — a tag can be moved by whoever
# controls the action, and this job holds a token that can publish binaries people install.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The draft has to exist before the matrix starts. Four parallel jobs each asking
  # tauri-action to create a release for the same tag is a race, and it loses: two of
  # them win, and the artifacts end up split across two drafts with neither complete.
  create-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.make.outputs.result }}
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: make
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '')
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Tocky Voice ${tag}`,
              body: [
                'See the README for install steps.',
                '',
                '**macOS**: the app is not notarised, so the first launch needs',
                'right-click → Open, and Accessibility permission has to be granted',
                'before pasting works.',
                '',
                'If macOS instead says the app "is damaged and can\'t be opened", run',
                '`xattr -cr "/Applications/Tocky Voice.app"` in Terminal, then open it normally.',
              ].join('\n'),
              // Draft, so a human looks at what is about to be handed to people
              // before it becomes downloadable.
              draft: true,
            })
            return data.id

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      # One platform failing should not hide whether the others are fine.
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            name: macOS (Apple Silicon)
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            name: macOS (Intel)
          - platform: ubuntu-22.04
            args: ""
            name: Linux
          - platform: windows-latest
            args: ""
            name: Windows

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf \
            build-essential \
            curl wget file libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Upload into the draft the first job made, rather than each matrix job
          # trying to create one of its own.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
