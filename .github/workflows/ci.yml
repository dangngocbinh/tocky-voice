# Compiles and tests every platform on pushes and pull requests.
#
# Deliberately separate from the release workflow, and deliberately read-only. This job
# runs code from the repository — `pnpm install` executes dependency lifecycle scripts,
# `cargo test` compiles build scripts — on branches and pull requests, which is exactly
# where untrusted changes arrive. Giving it a token that can write to the repository
# would turn "a pull request that compiles" into "a pull request that can push".
#
# Every third-party action is pinned to a commit SHA rather than a tag. A tag can be
# moved; a SHA cannot. Without that, whoever controls one of these actions controls this
# workflow. Update them deliberately, not implicitly.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macOS
          - platform: ubuntu-22.04
            name: Linux
          - platform: windows-latest
            name: Windows

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libasound2-dev is for cpal (microphone capture) — easy to forget, and the
          # failure is a linker error a long way from anything about audio.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf \
            build-essential \
            curl wget file libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.platform }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build the frontend
        run: pnpm build

      - name: Rust tests
        working-directory: ./src-tauri
        # The live provider tests are `#[ignore]`d, so this needs no API keys.
        run: cargo test --lib

      - name: Rust compiles for this platform
        working-directory: ./src-tauri
        run: cargo check
