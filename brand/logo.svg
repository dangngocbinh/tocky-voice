<!-- Tocky Voice.
     A microphone standing in the middle of its own waveform: what you speak into, and
     what comes out. Drawn as vector rather than kept as the generated raster because
     the mark has to survive a 16px menu-bar and a 32px Dock tile, where a downscaled
     bitmap turns the outer bars into grey mush.

     Geometry is symmetrical about x=256 and the whole mark is centred in the canvas.
     Bars are strokes with round caps, so their drawn extent runs half a stroke width
     past each endpoint — the numbers below are centrelines, not edges. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <g fill="none" stroke="#FFC147" stroke-linecap="round">
    <!-- Waveform: three bars each side, growing towards the middle. -->
    <g stroke-width="28">
      <path d="M81 244v46"/>
      <path d="M126 219v96"/>
      <path d="M173 192v150"/>
      <path d="M339 192v150"/>
      <path d="M386 219v96"/>
      <path d="M431 244v46"/>
    </g>
    <!-- Cradle, then the stand. -->
    <path d="M206 262a50 50 0 0 0 100 0" stroke-width="12"/>
    <path d="M256 312v74" stroke-width="19"/>
  </g>
  <!-- Capsule head. Taller than the tallest bar so it stays the subject. -->
  <rect x="221" y="105" width="70" height="194" rx="35" fill="#FFC147"/>
  <!-- Foot. -->
  <rect x="217" y="386" width="78" height="20" rx="10" fill="#FFC147"/>
</svg>
